<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #121212;
        font-family: Arial, sans-serif;
      }
      .card {
        background: #1d1d1d;
        padding: 32px 28px;
        border-radius: 14px;
        box-shadow: 0 10px 28px rgba(0,0,0,0.35);
        text-align: center;
      }
      h1 {
        margin: 0 0 20px;
        color: #fff;
        font-size: 28px;
      }
      button {
        background: #1d4ed8;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 28px;
        font-size: 18px;
        cursor: pointer;
      }
      button:hover {
        background: #1e40af;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Log in</h1>
      <button id="loginButton" type="button">Log In</button>
    </div>

    <script>
      const loginButton = document.getElementById('loginButton');
      loginButton.addEventListener('click', function () {
        window.location.href = 'Google.html';
      });
    </script>
  </body>
</html>
