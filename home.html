<script>
  document.addEventListener('DOMContentLoaded', () => {
    const isAuthAction = (text = '') => {
      const normalized = text.toLowerCase();
      return normalized.includes('log in') || normalized.includes('login') || normalized.includes('sign up') || normalized.includes('create account') || normalized.includes('criar conta');
    };

    const elements = [...document.querySelectorAll('a, button, input[type="submit"], input[type="button"]')].filter((el) => {
      const text = (el.textContent || el.value || el.getAttribute('aria-label') || '').trim();
      return isAuthAction(text);
    });

    elements.forEach((element) => {
      element.addEventListener('click', (event) => {
        event.preventDefault();
        window.location.href = 'login.html';
      });
    });
  });
</script>
